projects:
  - name: Postura
    url: https://github.com/TABA-postura/Backend
    headline: 실시간 자세 교정 헬스케어 서비스
    period: 2025
    status: done
    award: TABA 10기 최우수상 — 과학기술정보통신부 · 정보통신기획평가원 · 단국대학교
    subtitle: AI 기반 자세 교정 헬스케어 서비스 · 백엔드 인증/인가 전담 · CI/CD 공동 구축 · 5인 팀 (프론트 2, AI 1, 백엔드 2)
    intro: 웹캠으로 사용자의 자세를 실시간 분석하고 교정 피드백을 제공하는 헬스케어 서비스입니다.
    oneline: 웹캠 기반 실시간 자세 교정 헬스케어 서비스 · 백엔드 인증/인가 전담
    summary: 백엔드 인증/인가 전담. OAuth2 소셜 로그인과 JWT 인증 체계를 설계하고, Refresh Token을 DB에 저장·로테이션해 탈취된 토큰의 재사용을 차단했습니다.
    details:
      - title: 소셜 로그인 전체 구현
        body: Google(OIDC)·Kakao(OAuth2)를 Spring Security OAuth2로 구현; provider 불일치·중복 이메일 엣지 케이스 처리 및 사용자 자동 가입/업데이트 로직 작성
      - title: JWT 인증 시스템 설계 및 구현
        body: Access/Refresh 이중 토큰 방식, JwtTokenProvider·JwtAuthenticationFilter 작성, 로컬·소셜 공통 토큰 발급 인터페이스 통일
      - title: Refresh Token 검증 체계 설계
        body: 사용자당 1건으로 DB에 저장해 서버가 강제 무효화할 수 있게 하고, 재발급 시 서명 검증 → 저장된 토큰 대조 → 클레임·DB의 userId 교차 검증을 거친 뒤 토큰을 로테이션해 탈취된 토큰의 재사용을 차단
      - title: Spring Security 보안 설정 전담
        body: Stateless 세션, CORS 최소화, 경로별 인가 정책, OAuth2 성공·실패 핸들러 작성
      - title: CI/CD 파이프라인 공동 구축
        body: GitHub Actions로 Docker 이미지 빌드·푸시 및 AWS EC2 자동 배포를 팀원과 함께 구성; AWS ALB HealthCheck 엔드포인트 연동
      - title: 콘텐츠 검색 API
        body: 카테고리·키워드·신체 관련 부위 복합 조건 JPQL 검색 쿼리 작성 및 REST API 노출
    tech: [Java 17, Spring Boot 3, Spring Security, OAuth2, JWT, JPA, MySQL, Docker, AWS EC2/ALB, GitHub Actions]
    profile_tech: [Spring Boot, Spring Security, OAuth2, JWT, MySQL, AWS, Docker, GitHub Actions]

  - name: SkyDetect
    url: https://github.com/CAPSTONE-skydetect/skydetect-ai
    headline: 드론 · 조류 실시간 AI 분류 시스템
    period: 2026
    status: done
    subtitle: 드론·조류 실시간 AI 분류 시스템 · AI 파이프라인의 분류(C) 파트 전담 · 3인 팀
    intro: 캡스톤 프로젝트. 공항 인근 상공의 비행 객체를 실시간으로 드론/조류로 분류하는 시스템입니다.
    oneline: 드론·조류 실시간 AI 분류 시스템 · 분류(C) 파트 전담
    summary: AI 파이프라인의 분류(C) 단계 전담. RandomForest 분류기와 규칙 기반 사전 필터를 구현했습니다.
    details:
      - title: 공유 스키마 설계 참여
        body: 구현 전에 A(추적) / B(특징 추출) / C(분류) 파트 간 데이터 계약(schemas.py)을 먼저 확정하는 작업에 참여; C는 FeatureVector를 입력받아 PredictionResult를 반환
      - title: RF 분류기 구현
        body: FeatureVector를 입력받아 bird/drone/uncertain을 판정하는 RFClassifier 구현; confidence < 0.6 시 uncertain 처리 로직 설계
      - title: POST /classify 엔드포인트 구현
        body: RuleFilter → RFClassifier → PredictionResult 전체 추론 파이프라인을 FastAPI로 연결하고, 특징 중요도 요약을 응답에 포함
      - title: Sim2Real 재학습
        body: 노이즈 주입 v2 시뮬레이션 데이터 1,200개로 RF 모델 재학습, 실제 드론 궤적 분류 정확도 개선
      - title: 규칙 기반 사전 필터
        body: 품질 미달 트랙을 분류 전에 걸러내는 RuleFilter를 설계하고 pytest로 경계 조건 검증
    tech: [Python, FastAPI, scikit-learn, Pydantic, joblib, pytest]
    profile_tech: [Python, FastAPI, scikit-learn, pytest]

